<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Python Wizardry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column; path strip on top, streak card, then levels */
  --bg:#f3f2f8; --card:#ffffff; --ink:#1d1b2e; --muted:#666379; --line:#dcd9ea;
  --accent:#5b3fd1; --accent-soft:#e8e3fb; --flame:#d9780a; --flame-soft:#fdeedb; --ok:#1f8a5b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121f; --card:#1f1c30; --ink:#efedf8; --muted:#a09cb8; --line:#363250;
    --accent:#9b86ff; --accent-soft:#2c2650; --flame:#ffa23d; --flame-soft:#3a2a16; --ok:#4cc58f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121f; --card:#1f1c30; --ink:#efedf8; --muted:#a09cb8; --line:#363250;
  --accent:#9b86ff; --accent-soft:#2c2650; --flame:#ffa23d; --flame-soft:#3a2a16; --ok:#4cc58f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:20px 16px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.bar{height:14px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.pip{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:500 .8rem var(--mono);color:var(--muted);background:var(--card)}
.pip.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pip.now{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.streak{display:flex;align-items:center;gap:14px}
.flame{width:52px;height:52px;flex:0 0 auto}
.big{font:800 2.4rem/1 var(--display);color:var(--flame)}
.dots{display:flex;gap:8px;margin:14px 0}
.dot{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.dot b{display:block;height:26px;border-radius:8px;background:var(--flame-soft);margin-bottom:4px}
.dot.on b{background:var(--flame)}
button{font:600 1rem var(--body);border:0;border-radius:12px;padding:14px 16px;width:100%;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{background:var(--accent-soft);color:var(--muted);cursor:default}
button:focus-visible,summary:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.rw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .d{flex:0 0 auto;min-width:54px;text-align:center;font:500 .85rem var(--mono);padding:4px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.rw.got .d{background:var(--flame);color:#fff}
.rw.lock{color:var(--muted)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
.test{color:var(--muted);font-size:.88rem;margin:6px 0 4px}
ol{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
li{display:flex;gap:10px;align-items:center;padding:6px 0;margin-left:-23px}
li .c{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
li.done .c{background:var(--ok);border-color:var(--ok)}
li.next .c{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
li.done span{color:var(--muted);text-decoration:line-through}
.tag{font:500 .72rem var(--mono);color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
@media (prefers-reduced-motion:reduce){.bar > i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const LEVELS=[
 {t:"Initiate",test:"Predict what a short program prints.",s:["Values and names","Types and strictness","Division and truthiness","Run a file yourself"]},
 {t:"Apprentice",test:"Write a 10-line program from a blank file.",s:["Lists and dicts","Functions","if and loops","Files and errors","Solve a 10-line task alone"]},
 {t:"Journeyman",test:"Build a small command-line tool alone.",s:["Modules and imports","Classes","Exceptions","Tests with pytest","Ship a small CLI"]},
 {t:"Engineer",test:"Add a feature to a library-based app with no walkthrough.",s:["Pydantic models","A FastAPI endpoint alone","Calling an HTTP API","A database","Add a feature unaided"]},
 {t:"Architect",test:"Structure and ship a real product.",s:["Type hints","Project structure","Async basics","Debug code you did not write","Sarvantha v1 live"]},
 {t:"Adept",test:"Write idiomatic Python without thinking about it.",s:["Comprehensions","Generators","Decorators","Context managers","Profile a slow function"]},
 {t:"Artisan",test:"Design a library others can use.",s:["Design a clean API","Packaging","Strict typing with mypy","Fix a production bug","Review an architecture"]},
 {t:"Wizard",test:"Explain and use how Python works inside.",s:["The GIL and threads","Memory and references","The import system","Descriptors and metaclasses","Read CPython source"]},
 {t:"Archmage",test:"Publish a library strangers depend on.",s:["Publish to PyPI","Docs site","Release pipeline","100 installs by strangers","Handle issues and pull requests"]},
 {t:"Sage",test:"Get your code merged into major projects.",s:["First merged pull request","Five merged pull requests","Review others' code","Fix a bug in a major library","Write a deep technical post"]},
 {t:"Legend",test:"Others learn from and build on your work.",s:["Teach a full course","A library others rely on","Mentor 10 people","Syntaxo flagship project","Lead an open-source project"]}
];
const REWARDS=[
 [3,"You choose the next lesson topic."],
 [7,"One streak freeze, plus one hour of free-roam coding on anything you like."],
 [14,"Post your progress on Syntaxo or LinkedIn. Public proof counts."],
 [30,"A guilt-free rest day. Your streak stays safe."],
 [60,"Bonus lesson: we read a real standard-library module's source together."],
 [100,"Title: Hundred-Day Pythonista. Plan your first small library."]
];
// Stones are updated by hand in a commit when a skill is proven. Streak lives in this browser.
const DONE=["0.0","0.1","0.2","0.3","1.0","1.1","1.2","1.3"];
const START="2026-11-17";
const KEY="wizardry-v1";
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.days))return j}catch(e){}
  return {last:"2026-11-17",streak:1,best:1,freezes:0,days:["2026-11-17"]};
}
function save(n){
  try{localStorage.setItem(KEY,JSON.stringify({last:n.last,streak:n.streak,best:n.best,freezes:n.freezes,days:n.days}));return true}catch(e){return false}
}
let S=Object.assign(load(),{done:DONE,start:START});
const ymd=d=>d.toLocaleDateString('en-CA');
const today=()=>ymd(new Date());
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const shift=(d,n)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return ymd(t)};
const key=(l,i)=>l+'.'+i;
const doneCount=l=>LEVELS[l].s.filter((_,i)=>S.done.includes(key(l,i))).length;
const levelDone=l=>doneCount(l)===LEVELS[l].s.length;
const current=()=>{for(let l=0;l<LEVELS.length;l++){if(!levelDone(l))return l}return LEVELS.length-1};
const FLAME='<svg class="flame" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3c2 8 11 12 11 24a11 11 0 0 1-22 0c0-5 3-8 5-11 1 4 3 5 4 5 0-7-1-12 2-18z" fill="var(--flame)"/><path d="M24 24c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 3-6z" fill="var(--flame-soft)"/></svg>';

function render(){
  const total=LEVELS.reduce((n,L)=>n+L.s.length,0), got=S.done.length, pct=Math.round(got/total*100);
  const cur=current(), t=today(), gap=diff(t,S.last);
  const state=gap===0?"Logged today":gap===1?"Log today to keep it":(gap===2&&S.freezes>0)?"Freeze will save it":"Streak reset. Start again";
  const shown=gap<=1||(gap===2&&S.freezes>0)?S.streak:0;
  let h='';
  h+=`<header><h1>Python Wizardry</h1><p class="sub">Level ${cur} of 10, ${LEVELS[cur].t}. Started ${S.start}.</p></header>`;
  h+=`<section class="card"><div class="row"><h2>Stepping stones</h2><span class="num">${got} / ${total}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
  <p class="note">${pct}% of the path. A stone turns green only when you have shown it by writing the code yourself.</p>
  <div class="strip">${LEVELS.map((L,i)=>`<div class="pip ${levelDone(i)?'done':i===cur?'now':''}" title="${L.t}">${i}</div>`).join('')}</div></section>`;
  const week=[];for(let i=6;i>=0;i--){const d=shift(t,-i);week.push(`<div class="dot ${S.days.includes(d)?'on':''}"><b></b>${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</div>`)}
  h+=`<section class="card"><div class="streak">${FLAME}<div><div class="big num">${shown}</div><div class="sub">day streak. Best ${S.best}. Freezes ${S.freezes}.</div></div></div>
  <div class="dots">${week.join('')}</div>
  <button id="log" ${gap===0?'disabled':''}>${gap===0?'Rep logged for today':'Log today\'s rep'}</button>
  <p class="note" id="msg">${state}. A rep is 30 minutes where you wrote and ran code yourself, from a blank file.</p></section>`;
  h+=`<section class="card"><h2>Streak rewards</h2>${REWARDS.map(([d,r])=>`<div class="rw ${S.best>=d?'got':'lock'}"><span class="d">${d} days</span><span>${r}${S.best>=d?' <b>Unlocked.</b>':''}</span></div>`).join('')}
  <p class="note">A freeze is earned at every 7 days, up to 2. It covers one missed day.</p></section>`;
  h+=`<section class="card"><h2>The ten levels</h2>${LEVELS.map((L,l)=>{
    const nextIdx=L.s.findIndex((_,i)=>!S.done.includes(key(l,i)));
    return `<details ${l===cur?'open':''}><summary><span>Level ${l}, ${L.t}</span><span class="tag">${doneCount(l)} / ${L.s.length}</span></summary>
    <p class="test">Test: ${L.test}</p><ol>${L.s.map((s,i)=>`<li class="${S.done.includes(key(l,i))?'done':(l===cur&&i===nextIdx)?'next':''}"><i class="c"></i><span>${s}</span></li>`).join('')}</ol></details>`}).join('')}</section>`;
  document.getElementById('app').innerHTML=h;
  const b=document.getElementById('log'); if(b)b.addEventListener('click',logRep);
}

async function logRep(){
  const t=today(), gap=diff(t,S.last), msg=document.getElementById('msg');
  if(gap===0)return;
  const n=JSON.parse(JSON.stringify(S));
  if(gap===1){n.streak+=1}
  else if(gap===2&&n.freezes>0){n.freezes-=1;n.streak+=1}
  else{n.streak=1}
  n.best=Math.max(n.best,n.streak);
  if(n.streak%7===0&&n.freezes<2)n.freezes+=1;
  n.last=t; n.days=n.days.concat([t]).slice(-60);
  n.done=DONE; n.start=START;
  if(!save(n)){msg.textContent='This browser blocked saving, so the streak will not stick. Allow site storage and try again.';return}
  S=n; render();
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
